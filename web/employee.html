<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Kiosk · Absence Less</title>
  <link rel="icon" href="/assets/absence-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=46" />
  <script>
    (function () {
      try {
        if (localStorage.getItem("access_pass_night") === "1") document.documentElement.classList.add("night");
      } catch (e) {}
    })();
  </script>
</head>
<body class="kiosk" data-state="scanning">
  <header class="kiosk-bar">
    <img src="/assets/absence-mark.svg" alt="Absence Less" />
    <div class="kiosk-bar-right">
      <span id="kiosk-time" class="kiosk-time"></span>
      <button type="button" class="ghost" id="btn-night" data-night-button aria-pressed="false">Night</button>
      <a href="/">Home</a>
    </div>
  </header>
  <main class="kiosk-main">
    <div class="viewfinder kiosk-cam">
      <video id="video" autoplay playsinline muted webkit-playsinline></video>
      <div class="corners"></div>
      <div class="scan-line"></div>
      <button id="btn-enable-cam" class="cam-gate" type="button">Tap to start camera</button>
    </div>
    <aside class="kiosk-panel">
      <p class="eyebrow state-chip" id="state-label">Scanning</p>
      <h1 id="hello">Look at the camera</h1>
      <p class="lede" id="sub">You will be clocked in automatically.</p>
      <p class="scan-status" id="meta"></p>
      <button id="btn-clockout" class="primary hidden" type="button">Clock out</button>
    </aside>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <p class="eyebrow">Clock out</p>
      <h2 id="modal-text">Hi, are you ready to clock out?</h2>
      <div class="actions">
        <button id="btn-confirm-out" class="primary" type="button">Yes, clock out</button>
        <button id="btn-cancel-out" class="ghost" type="button">Cancel</button>
      </div>
    </div>
  </div>
  <canvas id="canvas" hidden></canvas>
  <script src="/static/js/shared.js?v=26"></script>
  <script src="/static/js/employee.js?v=25"></script>
</body>
</html>
